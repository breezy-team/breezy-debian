---
name: Publish to PyPI

"on":
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Upgrade packaging to avoid a bug in twine.
          # See https://github.com/pypa/twine/issues/1216
          pip install build "twine>=6.1.0" "packaging>=24.2"
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
      - name: Check that the version matches the tag
        run: |
          test -f "dist/brz_debian-${GITHUB_REF_NAME}.tar.gz" || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match $(echo dist/*.tar.gz)"
            exit 1
          }
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/brz-debian
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
